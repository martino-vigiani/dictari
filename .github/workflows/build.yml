name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Dictari needs the macOS 26 SDK (Xcode 26). This only works on a runner that
    # has it; if the label is not available yet, use a self-hosted macOS 26 runner.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The Liquid Glass app icon needs the newest actool; older Xcode crashes compiling it.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Dictari.xcodeproj -scheme Dictari \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            build CODE_SIGNING_ALLOWED=NO

      # No test step on purpose: the transcription tests download and run real
      # speech models, which is too slow for every push. Run them locally.
