name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Dictari needs the macOS 26 SDK (Xcode 26). This only works on a runner that
    # has it; if the label is not available yet, use a self-hosted macOS 26 runner.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Hosted runners top out at Xcode 26.x, whose actool crashes on the Liquid Glass
      # AppIcon.icon (made with a newer Icon Composer). CI only checks that the code compiles,
      # so it drops that resource and falls back to the classic AppIcon.appiconset.
      - name: Skip the Liquid Glass icon
        run: |
          perl -0pi -e 's/      - path: Sources\/Dictari\/Resources\/AppIcon\.icon\n        type: file\n        buildPhase: resources\n//' project.yml
          ! grep -q 'path: Sources/Dictari/Resources/AppIcon.icon' project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Dictari.xcodeproj -scheme Dictari \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            build CODE_SIGNING_ALLOWED=NO

      # No test step on purpose: the transcription tests download and run real
      # speech models, which is too slow for every push. Run them locally.
